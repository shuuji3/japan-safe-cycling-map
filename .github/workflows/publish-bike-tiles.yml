name: Publish bike tiles to R2

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Resolve OSM extract date
        id: osm
        run: |
          url="$(curl -sI -o /dev/null -w '%{redirect_url}' https://download.geofabrik.de/asia/japan-latest.osm.pbf)"
          echo "stamp=$(basename "$url" .osm.pbf)" >> "$GITHUB_OUTPUT"

      - name: Cache OSM extract and build tools (.cache)
        uses: actions/cache@v6
        id: cache
        with:
          path: .cache
          key: bike-cache-${{ runner.os }}-${{ steps.osm.outputs.stamp }}

      - name: Sync Python deps
        run: uv sync --frozen --no-install-project

      - name: Build bike tiles
        run: make

      - name: Upload tiles to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: pnpm upload-bike-data
