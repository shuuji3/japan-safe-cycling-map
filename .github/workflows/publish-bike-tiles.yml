name: Publish bike tiles to R2

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      # decide whether an update is needed BEFORE restoring the ~2.6GB data cache.
      # state.txt is a cheap http call; the old japan-updates path now 301-redirects.
      - name: Resolve latest OSM replication sequence
        id: osm
        run: |
          seq="$(curl -sL --fail --max-time 60 https://download.geofabrik.de/asia/japan/updates/state.txt | sed -n 's/^sequenceNumber=//p')"
          if ! [[ "$seq" =~ ^[0-9]+$ ]]; then
            echo "ERROR: failed to resolve a valid OSM replication sequence (got '$seq')" >&2
            exit 1
          fi
          echo "seq=$seq" >> "$GITHUB_OUTPUT"

      # tiny cache: remembers the sequence we last built, so a no-update run never pulls the big cache.
      # immutable caches -> unique key per sequence + static prefix fallback reads the newest.
      - name: Restore last OSM sequence
        uses: actions/cache/restore@v6
        with:
          path: seq
          key: osm-seq-${{ steps.osm.outputs.seq }}
          restore-keys: |
            osm-seq-
          fail-on-cache-miss: false

      - name: Detect OSM update needed
        id: update
        run: |
          last="$(cat seq/last-seq 2>/dev/null || true)"
          echo "cached_seq='$last'  latest_seq='${{ steps.osm.outputs.seq }}'"
          if [ -n "$last" ] && [ "$last" = "${{ steps.osm.outputs.seq }}" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- everything below runs only when OSM data actually changed ----
      - name: Restore OSM extract and build tools (.cache)
        if: steps.update.outputs.needs_update == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: osm-cache-${{ steps.osm.outputs.seq }}
          restore-keys: |
            osm-cache
          fail-on-cache-miss: false

      - name: Sync Python deps
        if: steps.update.outputs.needs_update == 'true'
        run: uv sync --frozen --no-install-project

      - name: Build bike tiles
        if: steps.update.outputs.needs_update == 'true'
        run: make

      - name: Persist latest OSM sequence
        if: steps.update.outputs.needs_update == 'true'
        run: |
          mkdir -p seq
          echo "${{ steps.osm.outputs.seq }}" > seq/last-seq

      - name: Upload tiles to R2
        if: steps.update.outputs.needs_update == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: pnpm upload-bike-data

      # new immutable entries only per real update; restore always finds the newest base via prefix.
      - name: Save OSM extract and build tools (.cache)
        if: steps.update.outputs.needs_update == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: osm-cache-${{ steps.osm.outputs.seq }}

      - name: Save latest OSM sequence
        if: steps.update.outputs.needs_update == 'true'
        uses: actions/cache/save@v6
        with:
          path: seq
          key: osm-seq-${{ steps.osm.outputs.seq }}
