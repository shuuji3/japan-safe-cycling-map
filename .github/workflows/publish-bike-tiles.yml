name: Publish bike tiles to R2

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Resolve OSM replication sequence
        id: osm
        run: |
          seq="$(curl -s https://download.geofabrik.de/asia/japan-updates/state.txt | sed -n 's/^sequenceNumber=//p')"
          echo "seq=$seq" >> "$GITHUB_OUTPUT"

      - name: Cache OSM extract and build tools (.cache)
        uses: actions/cache@v6
        id: cache
        with:
          path: .cache
          key: osm-cache

      - name: Detect OSM update
        id: update
        run: |
          if [ -f .cache/japan.osm.pbf ] && [ -f .cache/osm-seq ] && [ "$(cat .cache/osm-seq)" = "${{ steps.osm.outputs.seq }}" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Python deps
        run: uv sync --frozen --no-install-project

      - name: Build bike tiles
        if: steps.update.outputs.needs_update == 'true'
        run: make

      - name: Persist OSM sequence
        if: steps.update.outputs.needs_update == 'true'
        run: |
          mkdir -p .cache
          echo "${{ steps.osm.outputs.seq }}" > .cache/osm-seq

      - name: Upload tiles to R2
        if: steps.update.outputs.needs_update == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: pnpm upload-bike-data
