name: Publish bike tiles to R2

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache OSM extract and build tools (.cache)
        uses: actions/cache@v4
        id: cache
        with:
          path: .cache
          key: bike-cache-${{ runner.os }}-${{ hashFiles('scripts/planetiler/bike-schema.yml') }}
          restore-keys: |
            bike-cache-${{ runner.os }}-

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -o rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync Python deps
        run: uv sync --frozen --no-install-project

      - name: Build bike tiles
        run: scripts/build-bike-overlay.sh

      - name: Upload tiles to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: rclone copyto public/bike.pmtiles r2:${{ vars.R2_BUCKET }}/bike.pmtiles --s3-no-check-bucket
